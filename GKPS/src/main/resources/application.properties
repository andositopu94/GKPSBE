spring.application.name=GKPS
server.port=8080

spring.data.mongodb.uri=mongodb://localhost:27017/gkps

#logging
logging.level.root=INFO
logging.level.com.GKPS=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.web=DEBUG

#agar field null tetap terlihat
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Jakarta

#REDIS
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

#JWT
app.jwt.secret=${JWT_SECRET:62fe43e34e3c8333d290dfe6221864121949461f64a44e62b6e28ecc929e2bee}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
app.cors.max-age=3600

# Server Error Configuration
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# HTTP Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# Database Connection Pool
spring.data.mongodb.auto-index-creation=true